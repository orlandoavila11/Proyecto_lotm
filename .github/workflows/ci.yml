name: Path to Godhood CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22]

    defaults:
      run:
        working-directory: LOTM_SIMULADOR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: LOTM_SIMULADOR/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Verify Tier L Integrity (manifest v1.1)
        run: npm run verify:tier-l

      - name: Build Server & UI
        run: npm run build

      - name: Run Reborn Test Suite (including Kill -9 and Seeded PRNG)
        run: npm test

